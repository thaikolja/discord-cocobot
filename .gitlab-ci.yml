# Production: push/merge to `main` → pytest → SSH → $REMOTE_SCRIPT_PATH
# GitLab CI/CD variables (masked/protected as appropriate):
#   SSH_PRIVATE_KEY   private key that can log in as SSH_USER
#   SSH_HOST          production hostname
#   SSH_USER          remote user
#   REMOTE_SCRIPT_PATH  absolute path, normally /opt/bots/cocobot/deploy.sh
# deploy.sh on the host fast-forwards origin/main and rebuilds Docker Compose.

stages:
  - test
  - deploy

variables:
  SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
  SSH_HOST: $SSH_HOST
  SSH_USER: $SSH_USER
  REMOTE_SCRIPT_PATH: $REMOTE_SCRIPT_PATH

cache:
  paths:
    - .venv/

test:
  stage: test
  image: python:3.13-slim
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - export DISCORD_BOT_TOKEN=test_token
    - export DISCORD_SERVER_ID=test_server_id
    - export DISCORD_BOT_ID=test_bot_id
    - export WEATHERAPI_API_KEY=test_key
    - export CURRENCYAPI_API_KEY=test_key
    - export LOCALTIME_API_KEY=test_key
    - export GEMINI_API_KEY=test_key
    - export ACQIN_API_KEY=test_key
    - export GROQ_API_KEY=test_key
    - export DEEPSEEK_API_KEY=test_key
    - export DEEPSEEK_MODEL=deepseek-test-model
    - export ENVIRONMENT=testing
    - export TESTING=1
    - pytest tests/ -v

deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache openssh-client
    - test -n "$SSH_PRIVATE_KEY"
    - test -n "$SSH_HOST"
    - test -n "$SSH_USER"
    - test -n "$REMOTE_SCRIPT_PATH"
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "bash '$REMOTE_SCRIPT_PATH'"
