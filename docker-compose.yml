services:
  cocobot:
    build: .
    container_name: cocobot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://cocobot:${POSTGRES_PASSWORD:-password}@db:5432/cocobot
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - cocobot-network

  db:
    image: postgres:15-alpine
    container_name: cocobot-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=cocobot
      - POSTGRES_USER=cocobot
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    volumes:
      - cocobot-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocobot -d cocobot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cocobot-network

  redis:
    image: redis:7-alpine
    container_name: cocobot-redis
    restart: unless-stopped
    volumes:
      - cocobot-redis-data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cocobot-network
    command: redis-server --appendonly yes

volumes:
  cocobot-db-data:
  cocobot-redis-data:

networks:
  cocobot-network:
    driver: bridge
